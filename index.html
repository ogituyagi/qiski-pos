<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>QisKi Juice POS</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    html, body { width: 100%; height: 100%; background-color: #e8f5e9; color: #333; overflow: hidden; }
    
    .hidden { display: none !important; }
    .btn { border: none; padding: 8px 12px; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.2s; font-size: 13px; }
    .btn-primary { background: #27ae60; color: white; }
    .btn-secondary { background: #e74c3c; color: white; }
    .btn-warning { background: #f39c12; color: white; }

    /* Login Page */
    #login-page { display: flex; justify-content: center; align-items: center; width: 100%; height: 100vh; background-color: #e8f5e9; }
    .login-card { background: white; padding: 30px; border-radius: 12px; width: 100%; max-width: 360px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    .login-card h2 { margin-bottom: 20px; text-align: center; color: #27ae60; }
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; margin-bottom: 4px; font-size: 12px; font-weight: 600; }
    .form-group input, .form-group select { width: 100%; padding: 9px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }

    /* Main App Container (FIX OVERLAP) */
    #app-page { background: #f4f6f8; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
    header { background: #1e8449; color: white; padding: 10px 15px; display: flex; justify-content: space-between; align-items: center; height: 45px; flex-shrink: 0; }
    
    .view-content { padding: 10px; flex: 1; height: calc(100vh - 45px); overflow: hidden; }
    
    /* Layout POS Flex Fix */
    .pos-layout { display: flex; flex-direction: column; gap: 10px; height: 100%; overflow: hidden; }
    @media (min-width: 768px) {
      .pos-layout { flex-direction: row; }
      .menu-section { flex: 6; overflow-y: auto; height: 100%; padding-right: 5px; }
      .cart-section { flex: 4; height: 100%; }
    }

    /* Customer Header */
    .customer-header { background: #fff; padding: 8px; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.05); margin-bottom: 8px; display: flex; gap: 8px; }

    /* Menu Grid */
    .category-title { font-size: 13px; font-weight: bold; color: #1e8449; margin: 10px 0 6px 0; border-bottom: 2px solid #27ae60; padding-bottom: 2px; }
    .menu-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(115px, 1fr)); gap: 8px; }
    .menu-card { border: 1px solid #e0e0e0; border-radius: 8px; padding: 10px 6px; text-align: center; background: #fff; cursor: pointer; border-left: 4px solid #27ae60; user-select: none; }
    .menu-card:active { transform: scale(0.96); background: #e8f5e9; }
    .menu-card h4 { font-size: 12px; margin-bottom: 4px; color: #333; }
    .menu-card .price { color: #27ae60; font-weight: bold; font-size: 11px; }

    /* Cart Section (Tinggi Terkunci, No Overlap) */
    .cart-section { background: #fff; padding: 12px; border-radius: 8px; display: flex; flex-direction: column; height: 100%; box-shadow: 0 1px 4px rgba(0,0,0,0.05); overflow: hidden; }
    .cart-items { flex: 1; overflow-y: auto; margin: 8px 0; padding-right: 4px; }
    .cart-item { padding: 8px 0; border-bottom: 1px dashed #eee; display: flex; flex-direction: column; gap: 3px; }
    .cart-item-header { display: flex; justify-content: space-between; align-items: center; }
    .cart-item-notes { font-size: 11px; color: #d35400; background: #fef5e7; padding: 2px 6px; border-radius: 4px; display: inline-block; width: fit-content; }
    .btn-qty { width: 26px; height: 26px; border-radius: 50%; border: 1px solid #ccc; background: #fff; font-weight: bold; cursor: pointer; }
    
    .cart-footer { border-top: 2px dashed #eee; padding-top: 8px; background: #fff; flex-shrink: 0; }
    .cart-total { display: flex; justify-content: space-between; font-weight: bold; font-size: 16px; margin-bottom: 8px; color: #2c3e50; }
    .cart-actions { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }

    /* Modals */
    .modal-overlay { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.5); display: flex; justify-content: center; align-items: center; z-index: 1000; padding: 15px; }
    .modal-content { background: white; padding: 18px; border-radius: 10px; width: 100%; max-width: 380px; max-height: 90vh; overflow-y: auto; }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; border-bottom: 1px solid #eee; padding-bottom: 8px; }
    .chip-group { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
    .chip { border: 1px solid #ccc; padding: 6px 10px; border-radius: 16px; font-size: 12px; cursor: pointer; background: #f9f9f9; }
    .chip.selected { background: #27ae60; color: white; border-color: #27ae60; }
  </style>
</head>
<body>

  <!-- PAGE 1: LOGIN -->
  <div id="login-page">
    <div class="login-card">
      <h2>🥤 QisKi Juice</h2>
      <p style="text-align: center; color: #666; margin-bottom: 15px; font-size: 12px;">Point of Sales System</p>
      <form onsubmit="handleLogin(event)">
        <div class="form-group"><label>Username</label><input type="text" id="username" required></div>
        <div class="form-group"><label>Password</label><input type="password" id="password" required></div>
        <button type="submit" class="btn btn-primary" style="width: 100%;">LOGIN KASIR</button>
      </form>
    </div>
  </div>

  <!-- PAGE 2: MAIN APP -->
  <div id="app-page" class="hidden">
    <header>
      <div><b>🥤 QisKi Juice POS</b> | <span id="user-display">Kasir</span></div>
      <button onclick="logout()" class="btn btn-secondary" style="font-size: 11px; padding: 4px 8px;">Logout</button>
    </header>

    <div class="view-content">
      <div class="pos-layout">
        
        <!-- LEFT: CATALOG -->
        <div class="menu-section">
          <div class="customer-header">
            <input type="text" id="cust-name" placeholder="Nama Pelanggan / No. Pemesan..." style="flex:2; padding:8px; border:1px solid #ccc; border-radius:6px; font-size:13px;">
            <select id="select-customer-type" style="flex:1; padding:8px; border:1px solid #ccc; border-radius:6px; font-size:12px;">
              <option value="REGULAR">Umum</option>
              <option value="MEMBER">Member QSK</option>
            </select>
          </div>
          <div id="catalog-container"></div>
        </div>

        <!-- RIGHT: CART -->
        <div class="cart-section">
          <h3 style="font-size:14px; border-bottom:1px solid #eee; padding-bottom:5px; flex-shrink: 0;">Keranjang Pesanan</h3>
          <div class="cart-items" id="cart-items">
            <p style="color: #888; text-align: center; margin-top: 30px; font-size:13px;">Keranjang kosong</p>
          </div>

          <div class="cart-footer">
            <div class="cart-total">
              <span>Total:</span>
              <span id="cart-total-val">Rp 0</span>
            </div>
            <div class="cart-actions">
              <button onclick="clearCart()" class="btn btn-secondary">Batal</button>
              <button onclick="savePendingOrder()" class="btn btn-warning">Pending</button>
              <button onclick="openPaymentModal()" class="btn btn-primary">Bayar</button>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>

  <!-- MODAL CUSTOM MODIFIER (DUAL MODE) -->
  <div id="custom-modal" class="modal-overlay hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="custom-modal-title">Custom Order</h3>
        <button onclick="closeModal('custom-modal')" style="border:none; background:none; font-size:18px; cursor:pointer;">✖</button>
      </div>
      
      <div class="form-group">
        <label>Level Es (Ice):</label>
        <div class="chip-group" id="ice-chips">
          <div class="chip selected" onclick="selectChip(this, 'ice', 'Normal Ice')">Normal Ice</div>
          <div class="chip" onclick="selectChip(this, 'ice', 'Less Ice')">Less Ice</div>
          <div class="chip" onclick="selectChip(this, 'ice', 'No Ice')">No Ice</div>
        </div>
      </div>

      <div class="form-group" style="margin-top:12px;">
        <label>Level Gula (Sugar):</label>
        <div class="chip-group" id="sugar-chips">
          <div class="chip selected" onclick="selectChip(this, 'sugar', 'Normal Sugar')">Normal Sugar</div>
          <div class="chip" onclick="selectChip(this, 'sugar', 'Less Sugar')">Less Sugar</div>
          <div class="chip" onclick="selectChip(this, 'sugar', 'No Sugar')">No Sugar</div>
        </div>
      </div>

      <!-- CONTROLLER MODE 1: DARI HOLD TAP (TOMBOL + / -) -->
      <div class="form-group hidden" style="margin-top:12px;" id="mode-hold-group">
        <label>Jumlah Pesanan Custom (Pcs):</label>
        <div style="display:flex; align-items:center; gap:12px; margin-top:6px;">
          <button class="btn-qty" onclick="adjustHoldQty(-1)" style="width:36px; height:36px; font-size:16px;">-</button>
          <span id="hold-qty-val" style="font-weight:bold; font-size:18px;">1</span>
          <button class="btn-qty" onclick="adjustHoldQty(1)" style="width:36px; height:36px; font-size:16px;">+</button>
        </div>
      </div>

      <!-- CONTROLLER MODE 2: DARI KERANJANG (DROPDOWN SMART SPLIT) -->
      <div class="form-group hidden" style="margin-top:12px;" id="mode-cart-group">
        <label>Terapkan catatan ini ke berapa item?</label>
        <select id="custom-apply-qty" style="padding:6px; font-size:13px; margin-top:4px;"></select>
      </div>

      <button onclick="saveCustomModifier()" class="btn btn-primary" style="width: 100%; margin-top: 15px;">MASUKKAN KE KERANJANG</button>
    </div>
  </div>

  <!-- MODAL PAYMENT -->
  <div id="payment-modal" class="modal-overlay hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Pembayaran</h3>
        <button onclick="closeModal('payment-modal')" style="border:none; background:none; font-size:18px; cursor:pointer;">✖</button>
      </div>
      <div class="form-group"><label>Total Akhir</label><input type="text" id="pay-total-akhir" readonly style="background:#e8f5e9; font-weight:bold; color:#27ae60; font-size:16px;"></div>
      <div class="form-group">
        <label>Metode Pembayaran</label>
        <select id="pay-method" onchange="togglePayMethod()">
          <option value="CASH">Cash / Tunai</option>
          <option value="QRIS">QRIS / Non-Tunai</option>
        </select>
      </div>
      <div id="cash-group">
        <div class="form-group"><label>Uang Diterima</label><input type="number" id="pay-cash-paid" oninput="calculatePayment()" placeholder="0"></div>
        <div class="form-group"><label>Kembalian</label><input type="text" id="pay-change" readonly style="font-weight:bold; color:#d35400;"></div>
      </div>
      <button onclick="submitTransaction()" class="btn btn-primary" style="width: 100%; margin-top: 10px; padding: 10px;">SELESAIKAN TRANSAKSI</button>
    </div>
  </div>

  <script>
    var API_URL = "https://script.google.com/macros/s/AKfycbwHA9QpcBwA-4vtFANUYDkUp_rJIxw0NilgbmxqSmgrTJWasiJ5_O_aGCT20QCnki1BjA/exec";

    var productsData = [
      { id: "JUS-001", nama: "Jus Apel", harga: 8000, kategori: "Jus Tunggal" },
      { id: "JUS-002", nama: "Jus Alpukat", harga: 8000, kategori: "Jus Tunggal" },
      { id: "JUS-003", nama: "Jus Belimbing", harga: 8000, kategori: "Jus Tunggal" },
      { id: "JUS-004", nama: "Jus Buah Naga", harga: 8000, kategori: "Jus Tunggal" },
      { id: "JUS-005", nama: "Jus Jeruk", harga: 8000, kategori: "Jus Tunggal" },
      { id: "JUS-006", nama: "Jus Melon", harga: 7000, kategori: "Jus Tunggal" },
      { id: "JUS-007", nama: "Jus Nanas", harga: 7000, kategori: "Jus Tunggal" },
      { id: "JUS-008", nama: "Jus Pepaya", harga: 7000, kategori: "Jus Tunggal" },
      { id: "JUS-009", nama: "Jus Stroberi", harga: 7000, kategori: "Jus Tunggal" },
      { id: "JUS-010", nama: "Jus Sirsak", harga: 7000, kategori: "Jus Tunggal" },

      { id: "MIX-001", nama: "Mangga + Jeruk", harga: 10000, kategori: "Mix Buah" },
      { id: "MIX-002", nama: "Pisang + Stroberi", harga: 10000, kategori: "Mix Buah" },
      { id: "MIX-003", nama: "Stroberi + Belimbing", harga: 10000, kategori: "Mix Buah" },
      { id: "MIX-004", nama: "Mangga + Buah Naga", harga: 10000, kategori: "Mix Buah" },
      { id: "MIX-005", nama: "Nanas + Lemon", harga: 10000, kategori: "Mix Buah" },
      { id: "MIX-006", nama: "Alpukat + Cokelat", harga: 10000, kategori: "Mix Buah" },

      { id: "HLT-001", nama: "Wortel + Apel", harga: 13000, kategori: "Healthy Mix" },
      { id: "HLT-002", nama: "Tomat + Wortel", harga: 13000, kategori: "Healthy Mix" },
      { id: "HLT-003", nama: "Apel + Timun", harga: 12000, kategori: "Healthy Mix" },
      { id: "HLT-004", nama: "Wortel + Pir", harga: 12000, kategori: "Healthy Mix" },
      { id: "HLT-005", nama: "Timun + Apel", harga: 12000, kategori: "Healthy Mix" },
      { id: "HLT-006", nama: "Wortel + Nanas", harga: 12000, kategori: "Healthy Mix" }
    ];

    var currentUser = null;
    var currentCart = [];
    
    // State Modal Custom
    var modalTriggerSource = null; // 'HOLD' atau 'CART'
    var activeCartIndex = null;
    var activeProductId = null;
    var holdCustomQty = 1;
    var selectedIce = "Normal Ice";
    var selectedSugar = "Normal Sugar";

    // Variables Hold Tap
    var holdTimer = null;
    var isLongPress = false;

    document.addEventListener("DOMContentLoaded", function() {
      checkExistingSession();
      renderCatalog();
    });

    function checkExistingSession() {
      var savedSession = localStorage.getItem('qiski_session');
      if (savedSession) {
        currentUser = JSON.parse(savedSession);
        document.getElementById('user-display').innerText = currentUser.nama;
        document.getElementById('login-page').classList.add('hidden');
        document.getElementById('app-page').classList.remove('hidden');
      }
    }

    function handleLogin(e) {
      e.preventDefault();
      var u = document.getElementById('username').value;
      var p = document.getElementById('password').value;

      fetch(API_URL, {
        method: 'POST',
        body: JSON.stringify({ action: 'checkLogin', username: u, password: p })
      })
      .then(res => res.json())
      .then(res => {
        if (res.success) {
          currentUser = res.user;
          localStorage.setItem('qiski_session', JSON.stringify(currentUser));
          document.getElementById('user-display').innerText = currentUser.nama;
          document.getElementById('login-page').classList.add('hidden');
          document.getElementById('app-page').classList.remove('hidden');
        } else { alert(res.message); }
      });
    }

    function renderCatalog() {
      var container = document.getElementById('catalog-container');
      var categories = ["Jus Tunggal", "Mix Buah", "Healthy Mix"];
      
      container.innerHTML = categories.map(cat => {
        var items = productsData.filter(p => p.kategori === cat);
        return `
          <div class="category-title">${cat}</div>
          <div class="menu-grid">
            ${items.map(p => `
              <div class="menu-card" 
                   onmousedown="startHold('${p.id}')" 
                   onmouseup="endHold('${p.id}')" 
                   onmouseleave="cancelHold()"
                   ontouchstart="startHold('${p.id}')" 
                   ontouchend="endHold('${p.id}')"
                   ontouchcancel="cancelHold()">
                <h4>${p.nama}</h4>
                <div class="price">Rp ${p.harga.toLocaleString('id-ID')}</div>
              </div>
            `).join('')}
          </div>
        `;
      }).join('');
    }

    // HOLD TAP HANDLER
    function startHold(productId) {
      isLongPress = false;
      holdTimer = setTimeout(function() {
        isLongPress = true;
        openHoldCustomModal(productId);
      }, 500);
    }

    function endHold(productId) {
      clearTimeout(holdTimer);
      if (!isLongPress) {
        directAddToCart(productId);
      }
    }

    function cancelHold() {
      clearTimeout(holdTimer);
    }

    // Direct Add to Cart (Tap Cepat)
    function directAddToCart(productId) {
      var prod = productsData.find(p => p.id === productId);
      var existing = currentCart.find(i => i.id === productId && (!i.notes || i.notes === "Normal"));

      if (existing) {
        existing.qty += 1;
      } else {
        currentCart.push({
          cartItemId: Date.now() + '_' + Math.random().toString(36).substr(2, 4),
          id: prod.id,
          nama: prod.nama,
          harga: prod.harga,
          qty: 1,
          notes: "Normal"
        });
      }
      updateCartUI();
    }

    // MODAL MODE 1: TRIGGER DARI HOLD TAP
    function openHoldCustomModal(productId) {
      modalTriggerSource = 'HOLD';
      activeProductId = productId;
      holdCustomQty = 1;
      resetChips();

      var prod = productsData.find(p => p.id === productId);
      document.getElementById('custom-modal-title').innerText = 'Custom: ' + prod.nama;
      
      document.getElementById('hold-qty-val').innerText = '1';
      document.getElementById('mode-hold-group').classList.remove('hidden');
      document.getElementById('mode-cart-group').classList.add('hidden');
      
      document.getElementById('custom-modal').classList.remove('hidden');
    }

    // MODAL MODE 2: TRIGGER DARI TOMBOL CUSTOM DI KERANJANG
    function openCartCustomModal(index) {
      modalTriggerSource = 'CART';
      activeCartIndex = index;
      resetChips();

      var item = currentCart[index];
      document.getElementById('custom-modal-title').innerText = 'Custom: ' + item.nama;
      
      var select = document.getElementById('custom-apply-qty');
      select.innerHTML = '';
      for (var i = 1; i <= item.qty; i++) {
        select.innerHTML += `<option value="${i}">${i} Pcs ${i === item.qty ? '(Semua)' : ''}</option>`;
      }
      select.value = item.qty;

      document.getElementById('mode-hold-group').classList.add('hidden');
      document.getElementById('mode-cart-group').classList.remove('hidden');
      
      document.getElementById('custom-modal').classList.remove('hidden');
    }

    function adjustHoldQty(delta) {
      holdCustomQty = Math.max(1, holdCustomQty + delta);
      document.getElementById('hold-qty-val').innerText = holdCustomQty;
    }

    function resetChips() {
      selectedIce = "Normal Ice";
      selectedSugar = "Normal Sugar";
      document.querySelectorAll('.chip').forEach(c => c.classList.remove('selected'));
      document.querySelectorAll('.chip-group').forEach(grp => grp.children[0].classList.add('selected'));
    }

    function selectChip(el, type, val) {
      var parent = el.parentElement;
      parent.querySelectorAll('.chip').forEach(c => c.classList.remove('selected'));
      el.classList.add('selected');
      if (type === 'ice') selectedIce = val;
      if (type === 'sugar') selectedSugar = val;
    }

    function saveCustomModifier() {
      var newNote = `${selectedIce}, ${selectedSugar}`;

      if (modalTriggerSource === 'HOLD') {
        // SIMPAN DARI HOLD TAP
        var prod = productsData.find(p => p.id === activeProductId);
        currentCart.push({
          cartItemId: Date.now() + '_' + Math.random().toString(36).substr(2, 4),
          id: prod.id,
          nama: prod.nama,
          harga: prod.harga,
          qty: holdCustomQty,
          notes: newNote
        });
      } else if (modalTriggerSource === 'CART') {
        // SIMPAN DARI KERANJANG (SMART SPLIT)
        var targetItem = currentCart[activeCartIndex];
        var applyQty = Number(document.getElementById('custom-apply-qty').value);

        if (applyQty === targetItem.qty) {
          targetItem.notes = newNote;
        } else {
          targetItem.qty -= applyQty;
          currentCart.push({
            cartItemId: Date.now() + '_split',
            id: targetItem.id,
            nama: targetItem.nama,
            harga: targetItem.harga,
            qty: applyQty,
            notes: newNote
          });
        }
      }

      closeModal('custom-modal');
      updateCartUI();
    }

    function updateCartUI() {
      var container = document.getElementById('cart-items');
      if (currentCart.length === 0) {
        container.innerHTML = '<p style="color: #888; text-align: center; margin-top: 30px; font-size:13px;">Keranjang kosong</p>';
        document.getElementById('cart-total-val').innerText = 'Rp 0';
        return;
      }

      var total = 0;
      container.innerHTML = currentCart.map((item, idx) => {
        var subtotal = item.harga * item.qty;
        total += subtotal;
        return `
          <div class="cart-item">
            <div class="cart-item-header">
              <strong>${item.nama}</strong>
              <small style="font-weight:bold;">Rp ${subtotal.toLocaleString('id-ID')}</small>
            </div>
            ${item.notes !== "Normal" ? `<div class="cart-item-notes">📝 ${item.notes}</div>` : ''}
            <div style="display:flex; justify-content:space-between; align-items:center; margin-top:4px;">
              <button onclick="openCartCustomModal(${idx})" class="btn btn-warning" style="font-size:10px; padding:3px 8px;">⚙️ Custom</button>
              <div style="display:flex; align-items:center; gap:6px;">
                <button class="btn-qty" onclick="updateQty(${idx}, -1)">-</button>
                <span style="font-weight:bold; font-size:13px;">${item.qty}</span>
                <button class="btn-qty" onclick="updateQty(${idx}, 1)">+</button>
              </div>
            </div>
          </div>
        `;
      }).join('');

      document.getElementById('cart-total-val').innerText = `Rp ${total.toLocaleString('id-ID')}`;
    }

    function updateQty(index, delta) {
      currentCart[index].qty += delta;
      if (currentCart[index].qty <= 0) currentCart.splice(index, 1);
      updateCartUI();
    }

    function clearCart() { currentCart = []; updateCartUI(); }

    function openPaymentModal() {
      if (currentCart.length === 0) return alert('Keranjang kosong!');
      var custName = document.getElementById('cust-name').value;
      if (!custName) return alert('Silakan isi nama/no pelanggan terlebih dahulu!');

      var subtotal = currentCart.reduce((a, b) => a + (b.harga * b.qty), 0);
      document.getElementById('pay-total-akhir').value = 'Rp ' + subtotal.toLocaleString('id-ID');
      document.getElementById('pay-cash-paid').value = '';
      document.getElementById('pay-change').value = 'Rp 0';
      document.getElementById('payment-modal').classList.remove('hidden');
    }

    function togglePayMethod() {
      var method = document.getElementById('pay-method').value;
      if (method === 'QRIS') document.getElementById('cash-group').classList.add('hidden');
      else document.getElementById('cash-group').classList.remove('hidden');
    }

    function calculatePayment() {
      var subtotal = currentCart.reduce((a, b) => a + (b.harga * b.qty), 0);
      var method = document.getElementById('pay-method').value;
      if (method === 'CASH') {
        var cashPaid = Number(document.getElementById('pay-cash-paid').value) || 0;
        var change = cashPaid - subtotal;
        document.getElementById('pay-change').value = change >= 0 ? 'Rp ' + change.toLocaleString('id-ID') : 'Uang Kurang!';
      }
    }

    function submitTransaction() {
      var subtotal = currentCart.reduce((a, b) => a + (b.harga * b.qty), 0);
      var method = document.getElementById('pay-method').value;
      var cashPaid = method === 'CASH' ? Number(document.getElementById('pay-cash-paid').value) || 0 : subtotal;
      var custName = document.getElementById('cust-name').value;

      if (method === 'CASH' && cashPaid < subtotal) return alert('Uang pembayaran masih kurang!');

      var payload = {
        kasirId: currentUser.id, customerName: custName, subtotal: subtotal, totalAkhir: subtotal,
        metode: method, cashPaid: cashPaid, items: currentCart
      };

      fetch(API_URL, {
        method: 'POST',
        body: JSON.stringify({ action: 'saveTransaction', payload: payload })
      })
      .then(res => res.json())
      .then(res => {
        if (res.success) {
          alert('Transaksi a/n ' + custName + ' Berhasil!');
          closeModal('payment-modal');
          document.getElementById('cust-name').value = '';
          clearCart();
        } else { alert('Gagal simpan: ' + res.message); }
      });
    }

    function closeModal(id) { document.getElementById(id).classList.add('hidden'); }
    function logout() { localStorage.removeItem('qiski_session'); location.reload(); }
  </script>
</body>
</html>
