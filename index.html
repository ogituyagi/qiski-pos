<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>QISKI JUICE</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- PAGE 1: LOGIN -->
  <div id="login-page">
    <div class="login-card">
      <div style="text-align: center; margin-bottom: 8px;">
        <img src="" id="login-brand-logo" alt="Qiski Juice Logo" style="max-width: 160px; height: auto; object-fit: contain;">
      </div>
      
      <p style="text-align: center; color: var(--text-muted); margin-bottom: 20px; font-size: 13px; font-weight: 600;">Point of Sales System</p>
      <form onsubmit="handleLogin(event)">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" autocomplete="username" required>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%; padding: 12px; margin-top: 10px;">LOGIN</button>
      </form>
    </div>
  </div>

  <!-- PAGE 2: MAIN APP -->
  <div id="app-page" class="hidden">
    <header>
      <!-- 1. LOGO BRAND -->
      <div class="header-brand" onclick="showDashboard()" style="cursor: pointer; display: flex; align-items: center; gap: 8px;">
        <img src="" id="header-brand-logo" alt="Logo" style="width: 72px; height: 72px; object-fit: contain;">
      </div>
    
      <!-- 2. TAB NAVIGASI DESKTOP -->
      <div class="header-tabs">
        <button type="button" class="tab-btn active" id="tab-home" onclick="showDashboard()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
          Home
        </button>
        
        <button type="button" class="tab-btn" id="tab-pending" onclick="openPendingTab()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          Pending
          <span id="badge-pending" class="badge-count" style="display: none;">0</span>
        </button>
        
        <button type="button" class="tab-btn" id="tab-kitchen" onclick="openKitchenTab()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"/><path d="m12 15-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"/><path d="M9 12H4s.55-3.03 2-4c1.62-1.08 3 0 3 0"/><path d="M12 15v5s3.03-.55 4-2c1.08-1.62 0-3 0-3"/></svg>
          Proses
          <span id="badge-proses" class="badge-count" style="display: none;">0</span>
        </button>
    
        <button type="button" class="tab-btn" id="tab-completed" onclick="openCompletedOrdersTab()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
          Selesai
          <span id="badge-selesai" class="badge-count" style="display: none;">0</span>
        </button>
      </div>
    
      <!-- 3. INDIKATOR STATUS ONLINE -->
      <div id="connection-status-indicator" style="display: flex; align-items: center; gap: 6px; font-size: 10px; font-weight: 700; background: rgba(0,0,0,0.2); padding: 4px 10px; border-radius: 20px;">
        <span id="status-dot" style="width: 7px; height: 7px; background: #4caf50; border-radius: 50%; display: inline-block;"></span>
        <span id="status-text" style="color: white;">Online First</span>
      </div>
    
      <!-- 4. USER & LOGOUT -->
      <div class="header-user-section" style="display: flex; align-items: center; gap: 8px;">
        <span id="user-display" style="font-size: 12px; font-weight: 700; color: white;">Kasir</span>
        <button type="button" onclick="logout()" title="Logout" class="btn" style="background: rgba(255,255,255,0.2); color: white; padding: 6px; border: none; border-radius: 6px; cursor: pointer; display: flex; align-items: center; justify-content: center;">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
            <polyline points="16 17 21 12 16 7"></polyline>
            <line x1="21" y1="12" x2="9" y2="12"></line>
          </svg>
        </button>
      </div>
    </header>

    <div class="view-content">
      
      <!-- VIEW 1: HOME DASHBOARD MENU -->
      <div id="home-dashboard-view">
        <div style="text-align: center; margin-top: 20px;"></div>

        <div class="dashboard-grid">
          <div class="dash-card" onclick="openNewOrderFlow()">
            <div class="dash-icon">
              <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
            </div>
            <h3>Pesanan Baru</h3>
          </div>

          <div class="dash-card" onclick="openDummyMenu('Rekap Penjualan Shift')">
            <div class="dash-icon">
              <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
            </div>
            <h3>Daftar Pesanan</h3>
          </div>

          <div class="dash-card" onclick="openDummyMenu('Rekap Penjualan Shift')">
            <div class="dash-icon">
              <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
            </div>
            <h3>Rekap Pesanan</h3>
          </div>
        </div>
      </div>

      <!-- VIEW 2: FLOW PESANAN BARU -->
      <div id="new-order-view" class="hidden" style="height: 100%;">
        <div class="pos-layout">
          <div class="menu-section">
            <div class="search-container">
              <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
              <input type="text" id="menu-search-input" placeholder="Cari menu jus / minuman..." oninput="filterCatalogMenu()">
            </div>
            <div id="catalog-container"></div>
          </div>

          <!-- KERANJANG BELANJA (INTERAKTIF BOTTOM SHEET MOBILE) -->
          <div class="cart-section" onclick="handleCartClick(event)">
            <div class="cart-mobile-handle" onclick="toggleMobileCart()">
              <span class="handle-bar"></span>
            </div>

            <div class="cart-header" onclick="toggleMobileCart()" style="cursor: pointer;">
              <h3>
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/>
                  <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
                </svg>
                <span>Pesanan: <strong id="cart-customer-name">Umum</strong></span>
              </h3>
            </div>

            <div class="cart-items" id="cart-items">
              <p style="color: var(--text-muted); text-align: center; margin-top: 40px; font-size:12px; font-weight: 700;">Keranjang masih kosong</p>
            </div>

            <div class="cart-footer">
              <div class="cart-total">
                <label>Total</label>
                <span id="cart-total-val" style="font-weight: 900;">Rp 0</span>
              </div>
              <div class="cart-actions">
                <button type="button" id="btnRed" onclick="handleRedButton()" class="btn btn-secondary">
                  <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
                  <span id="btnRedText">Batal</span>
                </button>
              
                <button type="button" onclick="savePendingOrder()" class="btn btn-warning">
                  <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                  Pending
                </button>
              
                <button type="button" onclick="openPaymentModal()" class="btn btn-success">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><line x1="6" y1="12" x2="10" y2="12"/><line x1="6" y1="16" x2="12" y2="16"/><circle cx="16" cy="12" r="2"/></svg>
                  Bayar
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- VIEW 3: KANTUNG PENDING -->
      <div id="pending-orders-view" class="view-section hidden" style="padding: 20px;">
        <div id="pending-orders-list" class="orders-grid"></div>
      </div>

      <!-- VIEW 4: ANTRIAN PROSES -->
      <div id="kitchen-orders-view" class="view-section hidden" style="padding: 20px;">
        <div id="kitchen-orders-list" class="orders-grid"></div>
      </div>

      <!-- VIEW 5: TAB KANTUNG SELESAI -->
      <div id="completed-orders-view" class="view-section hidden" style="padding: 20px;">
        <div id="completed-orders-list" class="orders-grid"></div>
      </div>
            
    </div>
  </div> <!-- PENUTUP APP-PAGE -->

  <!-- BOTTOM NAVIGATION BAR (POSISI SEJAJAR DI LUAR APP-PAGE) -->
  <div class="bottom-nav-bar">
    <button type="button" class="bottom-nav-item active" id="mobile-tab-home" onclick="showDashboard()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      Home
    </button>
    <button type="button" class="bottom-nav-item" id="mobile-tab-pending" onclick="openPendingTab()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      Pending
      <span id="mobile-badge-pending" class="badge-count" style="display: none;">0</span>
    </button>
    <button type="button" class="bottom-nav-item" id="mobile-tab-kitchen" onclick="openKitchenTab()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"/><path d="m12 15-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"/><path d="M9 12H4s.55-3.03 2-4c1.62-1.08 3 0 3 0"/><path d="M12 15v5s3.03-.55 4-2c1.08-1.62 0-3 0-3"/></svg>
      Proses
      <span id="mobile-badge-proses" class="badge-count" style="display: none;">0</span>
    </button>
    <button type="button" class="bottom-nav-item" id="mobile-tab-completed" onclick="openCompletedOrdersTab()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
      Selesai
      <span id="mobile-badge-selesai" class="badge-count" style="display: none;">0</span>
    </button>
  </div>

  <!-- ALL MODALS BELOW -->
  <div id="custom-modal" class="modal-overlay hidden">...</div>
  <div id="payment-modal" class="modal-overlay hidden">...</div>
  <div id="customer-gate-modal" class="modal-overlay hidden">...</div>
  <div id="add-member-modal" class="modal-overlay hidden">...</div>
  <div id="custom-alert-modal" class="modal-overlay hidden" style="z-index: 9999;">...</div>
  <div id="receipt-print-area" class="hidden-print">...</div>
  <div id="global-loading-modal" class="modal-overlay hidden" style="z-index: 99999; background: rgba(0, 0, 0, 0.5);">...</div>

  <script src="assets.js"></script>
  <script src="app.js"></script>
</body>
</html>
