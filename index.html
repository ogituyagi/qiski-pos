<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>QisKi Juice POS</title>
<style>
    :root {
      /* PALET WARNA SEIMBANG (SESUAI LOGO) */
      --primary-orange: #ff8c00;
      --primary-orange-dark: #e07b00;
      --primary-pink: #e91e63;
      --primary-pink-dark: #c2185b;
      
      --bg-cream: #fffaf5;
      --card-bg: #ffffff;
      --text-dark: #2c3e50;
      --text-muted: #7f8c8d;
      --border-color: #ffd8be;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    html, body { width: 100%; height: 100%; background-color: var(--bg-cream); color: var(--text-dark); overflow: hidden; }
    
    .hidden { display: none !important; }
    
    /* Buttons */
    .btn { border: none; padding: 10px 14px; border-radius: 8px; font-weight: 700; cursor: pointer; transition: all 0.2s ease; font-size: 13px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
    .btn-primary { background: var(--primary-orange); color: white; }
    .btn-primary:hover { background: var(--primary-orange-dark); }
    .btn-secondary { background: #e74c3c; color: white; }
    .btn-warning { background: #f39c12; color: white; }

    /* Login Page */
    #login-page { display: flex; justify-content: center; align-items: center; width: 100%; height: 100vh; background-color: var(--bg-cream); }
    .login-card { background: white; padding: 35px 30px; border-radius: 16px; width: 100%; max-width: 360px; box-shadow: 0 10px 25px rgba(233, 30, 99, 0.12); border: 1.5px solid var(--border-color); }
    .login-card h2 { margin-bottom: 20px; text-align: center; color: var(--primary-pink); font-size: 24px; font-weight: 800; }
    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; margin-bottom: 6px; font-size: 12px; font-weight: 700; color: var(--text-dark); }
    .form-group input, .form-group select { width: 100%; padding: 10px 12px; border: 1.5px solid var(--border-color); border-radius: 8px; font-size: 14px; outline: none; }
    .form-group input:focus { border-color: var(--primary-pink); }

    /* Main App Layout */
    #app-page { background: var(--bg-cream); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
    
    /* Header Pink Magenta (Sesuai Logo "Juice") */
    header { background: linear-gradient(135deg, var(--primary-pink), var(--primary-pink-dark)); color: white; padding: 0 16px; height: 50px; display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; box-shadow: 0 3px 12px rgba(233, 30, 99, 0.2); }
    .header-brand { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 16px; }
    
    .view-content { padding: 12px; flex: 1; height: calc(100vh - 50px); overflow: hidden; }
    .pos-layout { display: flex; flex-direction: column; gap: 12px; height: 100%; overflow: hidden; }
    
    @media (min-width: 768px) {
      .pos-layout { flex-direction: row; }
      .menu-section { flex: 6.2; overflow-y: auto; height: 100%; padding-right: 4px; }
      .cart-section { flex: 3.8; height: 100%; }
    }

    /* Customer Header */
    .customer-header { background: #fff; padding: 10px; border-radius: 12px; border: 1.5px solid var(--border-color); box-shadow: 0 2px 6px rgba(0,0,0,0.02); margin-bottom: 12px; display: flex; gap: 8px; }

    /* Kategori Pink Magenta */
    .category-title { font-size: 13px; font-weight: 800; color: var(--primary-pink); margin: 12px 0 8px 0; text-transform: uppercase; letter-spacing: 0.5px; display: flex; align-items: center; gap: 6px; }
    .category-title::after { content: ''; flex: 1; height: 2px; background: #fce4ec; border-radius: 2px; }
    
    .menu-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; }
    .menu-card { border: 1.5px solid var(--border-color); border-radius: 12px; padding: 12px 8px; text-align: center; background: #fff; cursor: pointer; user-select: none; transition: all 0.2s ease; border-left: 4px solid var(--primary-orange); }
    .menu-card:active { transform: scale(0.95); background: #fff5f8; border-color: var(--primary-pink); }
    .menu-card h4 { font-size: 12px; margin-bottom: 6px; color: var(--text-dark); font-weight: 700; line-height: 1.2; }
    .menu-card .price { color: var(--primary-orange); font-weight: 800; font-size: 12px; }

    /* Modern Cart Section */
    .cart-section { background: #fff; padding: 16px; border-radius: 16px; display: flex; flex-direction: column; height: 100%; border: 1.5px solid var(--border-color); box-shadow: 0 4px 15px rgba(0,0,0,0.03); overflow: hidden; }
    
    .cart-header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 12px; border-bottom: 1.5px solid var(--border-color); flex-shrink: 0; }
    .cart-header h3 { font-size: 15px; font-weight: 800; color: var(--primary-pink); display: flex; align-items: center; gap: 8px; }

    .cart-items { flex: 1; overflow-y: auto; margin: 12px 0; padding-right: 2px; display: flex; flex-direction: column; gap: 10px; }
    
    /* Modern Cart Item Card */
    .cart-item { background: #fffaf5; border: 1px solid #ffe8d6; padding: 12px; border-radius: 12px; display: flex; flex-direction: column; gap: 8px; transition: all 0.2s ease; }
    .cart-item-header { display: flex; justify-content: space-between; align-items: flex-start; }
    .cart-item-title { font-size: 13px; font-weight: 700; color: var(--text-dark); }
    .cart-item-price { font-size: 13px; font-weight: 800; color: var(--text-dark); }
    
    .cart-item-notes { font-size: 11px; color: var(--primary-pink-dark); background: #fce4ec; padding: 3px 8px; border-radius: 6px; font-weight: 600; display: inline-flex; align-items: center; gap: 4px; width: fit-content; }
    
    .cart-item-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 2px; }
    
    .btn-custom { background: #fff; border: 1px solid #ffccd5; color: var(--primary-pink); font-size: 11px; padding: 4px 10px; border-radius: 6px; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 4px; }
    .btn-custom:hover { background: #fff0f3; }

    .qty-control { display: flex; align-items: center; gap: 8px; background: #fff; border: 1px solid var(--border-color); border-radius: 20px; padding: 2px 6px; }
    .btn-qty { width: 24px; height: 24px; border-radius: 50%; border: none; background: #f0f0f0; color: var(--text-dark); font-weight: 800; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 14px; }
    .btn-qty:hover { background: var(--primary-pink); color: white; }
    .qty-num { font-weight: 800; font-size: 13px; min-width: 16px; text-align: center; }

    .cart-footer { border-top: 1.5px solid var(--border-color); padding-top: 12px; background: #fff; flex-shrink: 0; }
    .cart-total { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .cart-total label { font-size: 14px; font-weight: 700; color: var(--text-muted); }
    .cart-total val { font-size: 20px; font-weight: 900; color: var(--text-dark); }
    
    .cart-actions { display: grid; grid-template-columns: 1fr 1fr 1.2fr; gap: 8px; }

    /* Modals */
    .modal-overlay { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.5); backdrop-filter: blur(3px); display: flex; justify-content: center; align-items: center; z-index: 1000; padding: 15px; }
    .modal-content { background: white; padding: 20px; border-radius: 16px; width: 100%; max-width: 380px; max-height: 90vh; overflow-y: auto; border: 1.5px solid var(--border-color); box-shadow: 0 10px 30px rgba(0,0,0,0.15); }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; border-bottom: 1px solid var(--border-color); padding-bottom: 10px; }
    .modal-header h3 { font-size: 16px; font-weight: 800; color: var(--primary-pink); }
    
    .chip-group { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
    .chip { border: 1.5px solid var(--border-color); padding: 8px 14px; border-radius: 20px; font-size: 12px; font-weight: 700; cursor: pointer; background: #fff; color: var(--text-dark); transition: all 0.2s ease; }
    .chip.selected { background: var(--primary-pink); color: white; border-color: var(--primary-pink); }
  </style>
</head>
<body>

  <!-- PAGE 1: LOGIN -->
  <div id="login-page">
    <div class="login-card">
      <h2>QisKi Juice</h2>
      <p style="text-align: center; color: var(--text-muted); margin-bottom: 20px; font-size: 13px; font-weight: 600;">Point of Sales System</p>
      <form onsubmit="handleLogin(event)">
        <div class="form-group"><label>Username</label><input type="text" id="username" required></div>
        <div class="form-group"><label>Password</label><input type="password" id="password" required></div>
        <button type="submit" class="btn btn-primary" style="width: 100%; padding: 12px; margin-top: 10px;">LOGIN KASIR</button>
      </form>
    </div>
  </div>

  <!-- PAGE 2: MAIN APP -->
  <div id="app-page" class="hidden">
    <header>
      <div class="header-brand">
        <!-- SVG Logo Juice Icon -->
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
        <span>QisKi Juice POS</span>
      </div>
      <div style="display: flex; align-items: center; gap: 12px;">
        <span id="user-display" style="font-size: 13px; font-weight: 600;">Kasir</span>
        <button onclick="logout()" class="btn" style="background: rgba(255,255,255,0.2); color: white; padding: 4px 10px; font-size: 11px;">Logout</button>
      </div>
    </header>

    <div class="view-content">
      <div class="pos-layout">
        
        <!-- LEFT: CATALOG -->
        <div class="menu-section">
          <div class="customer-header">
            <input type="text" id="cust-name" placeholder="Nama Pelanggan / No. Pemesan..." style="flex:2; padding:9px 12px; border:1.5px solid var(--border-color); border-radius:8px; font-size:13px; outline:none;">
            <select id="select-customer-type" style="flex:1; padding:9px; border:1.5px solid var(--border-color); border-radius:8px; font-size:12px; outline:none;">
              <option value="REGULAR">Umum</option>
              <option value="MEMBER">Member QSK</option>
            </select>
          </div>
          <div id="catalog-container"></div>
        </div>

        <!-- RIGHT: MODERN CART -->
        <div class="cart-section">
          <div class="cart-header">
            <h3>
              <!-- SVG Cart Icon -->
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/></svg>
              Keranjang Pesanan
            </h3>
          </div>

          <div class="cart-items" id="cart-items">
            <p style="color: var(--text-muted); text-align: center; margin-top: 40px; font-size:13px; font-weight: 600;">Keranjang masih kosong</p>
          </div>

          <div class="cart-footer">
            <div class="cart-total">
              <label>Total Pembayaran</label>
              <val id="cart-total-val">Rp 0</val>
            </div>
            <div class="cart-actions">
              <button onclick="clearCart()" class="btn btn-secondary">Batal</button>
              <button onclick="savePendingOrder()" class="btn btn-warning">Pending</button>
              <button onclick="openPaymentModal()" class="btn btn-primary">Bayar</button>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>

  <!-- MODAL CUSTOM MODIFIER (DUAL MODE) -->
  <div id="custom-modal" class="modal-overlay hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="custom-modal-title">Custom Order</h3>
        <button onclick="closeModal('custom-modal')" style="border:none; background:none; font-size:18px; cursor:pointer; color:var(--text-muted);">✖</button>
      </div>
      
      <div class="form-group">
        <label>Level Es (Ice):</label>
        <div class="chip-group" id="ice-chips">
          <div class="chip selected" onclick="selectChip(this, 'ice', 'Normal Ice')">Normal Ice</div>
          <div class="chip" onclick="selectChip(this, 'ice', 'Less Ice')">Less Ice</div>
          <div class="chip" onclick="selectChip(this, 'ice', 'No Ice')">No Ice</div>
        </div>
      </div>

      <div class="form-group" style="margin-top:14px;">
        <label>Level Gula (Sugar):</label>
        <div class="chip-group" id="sugar-chips">
          <div class="chip selected" onclick="selectChip(this, 'sugar', 'Normal Sugar')">Normal Sugar</div>
          <div class="chip" onclick="selectChip(this, 'sugar', 'Less Sugar')">Less Sugar</div>
          <div class="chip" onclick="selectChip(this, 'sugar', 'No Sugar')">No Sugar</div>
        </div>
      </div>

      <!-- MODE 1: HOLD TAP (+ / -) -->
      <div class="form-group hidden" style="margin-top:14px;" id="mode-hold-group">
        <label>Jumlah Pesanan Custom (Pcs):</label>
        <div style="display:flex; align-items:center; gap:14px; margin-top:8px;">
          <button class="btn-qty" onclick="adjustHoldQty(-1)" style="width:36px; height:36px; font-size:16px;">-</button>
          <span id="hold-qty-val" style="font-weight:800; font-size:18px;">1</span>
          <button class="btn-qty" onclick="adjustHoldQty(1)" style="width:36px; height:36px; font-size:16px;">+</button>
        </div>
      </div>

      <!-- MODE 2: CARTS SMART SPLIT DROPDOWN -->
      <div class="form-group hidden" style="margin-top:14px;" id="mode-cart-group">
        <label>Terapkan catatan ini ke berapa item?</label>
        <select id="custom-apply-qty" style="padding:8px; font-size:13px; margin-top:6px; font-weight: 600;"></select>
      </div>

      <button onclick="saveCustomModifier()" class="btn btn-primary" style="width: 100%; margin-top: 20px; padding: 12px;">SIMPAN KE KERANJANG</button>
    </div>
  </div>

  <!-- MODAL PAYMENT -->
  <div id="payment-modal" class="modal-overlay hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Pembayaran Transaksi</h3>
        <button onclick="closeModal('payment-modal')" style="border:none; background:none; font-size:18px; cursor:pointer; color:var(--text-muted);">✖</button>
      </div>
      <div class="form-group"><label>Total Akhir</label><input type="text" id="pay-total-akhir" readonly style="background:#fff7f0; font-weight:800; color:var(--primary-orange-dark); font-size:18px;"></div>
      <div class="form-group">
        <label>Metode Pembayaran</label>
        <select id="pay-method" onchange="togglePayMethod()">
          <option value="CASH">Cash / Tunai</option>
          <option value="QRIS">QRIS / Non-Tunai</option>
        </select>
      </div>
      <div id="cash-group">
        <div class="form-group"><label>Uang Diterima</label><input type="number" id="pay-cash-paid" oninput="calculatePayment()" placeholder="0"></div>
        <div class="form-group"><label>Kembalian</label><input type="text" id="pay-change" readonly style="font-weight:800; color:var(--accent-pink);"></div>
      </div>
      <button onclick="submitTransaction()" class="btn btn-primary" style="width: 100%; margin-top: 15px; padding: 12px;">PROSES TRANSAKSI</button>
    </div>
  </div>

  <script>
    var API_URL = "https://script.google.com/macros/s/AKfycbwHA9QpcBwA-4vtFANUYDkUp_rJIxw0NilgbmxqSmgrTJWasiJ5_O_aGCT20QCnki1BjA/exec";

    var productsData = [
      { id: "JUS-001", nama: "Jus Apel", harga: 8000, kategori: "Jus Tunggal" },
      { id: "JUS-002", nama: "Jus Alpukat", harga: 8000, kategori: "Jus Tunggal" },
      { id: "JUS-003", nama: "Jus Belimbing", harga: 8000, kategori: "Jus Tunggal" },
      { id: "JUS-004", nama: "Jus Buah Naga", harga: 8000, kategori: "Jus Tunggal" },
      { id: "JUS-005", nama: "Jus Jeruk", harga: 8000, kategori: "Jus Tunggal" },
      { id: "JUS-006", nama: "Jus Melon", harga: 7000, kategori: "Jus Tunggal" },
      { id: "JUS-007", nama: "Jus Nanas", harga: 7000, kategori: "Jus Tunggal" },
      { id: "JUS-008", nama: "Jus Pepaya", harga: 7000, kategori: "Jus Tunggal" },
      { id: "JUS-009", nama: "Jus Stroberi", harga: 7000, kategori: "Jus Tunggal" },
      { id: "JUS-010", nama: "Jus Sirsak", harga: 7000, kategori: "Jus Tunggal" },

      { id: "MIX-001", nama: "Mangga + Jeruk", harga: 10000, kategori: "Mix Buah" },
      { id: "MIX-002", nama: "Pisang + Stroberi", harga: 10000, kategori: "Mix Buah" },
      { id: "MIX-003", nama: "Stroberi + Belimbing", harga: 10000, kategori: "Mix Buah" },
      { id: "MIX-004", nama: "Mangga + Buah Naga", harga: 10000, kategori: "Mix Buah" },
      { id: "MIX-005", nama: "Nanas + Lemon", harga: 10000, kategori: "Mix Buah" },
      { id: "MIX-006", nama: "Alpukat + Cokelat", harga: 10000, kategori: "Mix Buah" },

      { id: "HLT-001", nama: "Wortel + Apel", harga: 13000, kategori: "Healthy Mix" },
      { id: "HLT-002", nama: "Tomat + Wortel", harga: 13000, kategori: "Healthy Mix" },
      { id: "HLT-003", nama: "Apel + Timun", harga: 12000, kategori: "Healthy Mix" },
      { id: "HLT-004", nama: "Wortel + Pir", harga: 12000, kategori: "Healthy Mix" },
      { id: "HLT-005", nama: "Timun + Apel", harga: 12000, kategori: "Healthy Mix" },
      { id: "HLT-006", nama: "Wortel + Nanas", harga: 12000, kategori: "Healthy Mix" }
    ];

    var currentUser = null;
    var currentCart = [];
    
    var modalTriggerSource = null; 
    var activeCartIndex = null;
    var activeProductId = null;
    var holdCustomQty = 1;
    var selectedIce = "Normal Ice";
    var selectedSugar = "Normal Sugar";

    var holdTimer = null;
    var isLongPress = false;

    document.addEventListener("DOMContentLoaded", function() {
      checkExistingSession();
      renderCatalog();
    });

    function checkExistingSession() {
      var savedSession = localStorage.getItem('qiski_session');
      if (savedSession) {
        currentUser = JSON.parse(savedSession);
        document.getElementById('user-display').innerText = currentUser.nama;
        document.getElementById('login-page').classList.add('hidden');
        document.getElementById('app-page').classList.remove('hidden');
      }
    }

    function handleLogin(e) {
      e.preventDefault();
      var u = document.getElementById('username').value;
      var p = document.getElementById('password').value;

      fetch(API_URL, {
        method: 'POST',
        body: JSON.stringify({ action: 'checkLogin', username: u, password: p })
      })
      .then(res => res.json())
      .then(res => {
        if (res.success) {
          currentUser = res.user;
          localStorage.setItem('qiski_session', JSON.stringify(currentUser));
          document.getElementById('user-display').innerText = currentUser.nama;
          document.getElementById('login-page').classList.add('hidden');
          document.getElementById('app-page').classList.remove('hidden');
        } else { alert(res.message); }
      });
    }

    function renderCatalog() {
      var container = document.getElementById('catalog-container');
      var categories = ["Jus Tunggal", "Mix Buah", "Healthy Mix"];
      
      container.innerHTML = categories.map(cat => {
        var items = productsData.filter(p => p.kategori === cat);
        return `
          <div class="category-title">${cat}</div>
          <div class="menu-grid">
            ${items.map(p => `
              <div class="menu-card" 
                   onmousedown="startHold('${p.id}')" 
                   onmouseup="endHold('${p.id}')" 
                   onmouseleave="cancelHold()"
                   ontouchstart="startHold('${p.id}')" 
                   ontouchend="endHold('${p.id}')"
                   ontouchcancel="cancelHold()">
                <h4>${p.nama}</h4>
                <div class="price">Rp ${p.harga.toLocaleString('id-ID')}</div>
              </div>
            `).join('')}
          </div>
        `;
      }).join('');
    }

    function startHold(productId) {
      isLongPress = false;
      holdTimer = setTimeout(function() {
        isLongPress = true;
        openHoldCustomModal(productId);
      }, 500);
    }

    function endHold(productId) {
      clearTimeout(holdTimer);
      if (!isLongPress) { directAddToCart(productId); }
    }

    function cancelHold() { clearTimeout(holdTimer); }

    function directAddToCart(productId) {
      var prod = productsData.find(p => p.id === productId);
      var existing = currentCart.find(i => i.id === productId && (!i.notes || i.notes === "Normal"));

      if (existing) {
        existing.qty += 1;
      } else {
        currentCart.push({
          cartItemId: Date.now() + '_' + Math.random().toString(36).substr(2, 4),
          id: prod.id,
          nama: prod.nama,
          harga: prod.harga,
          qty: 1,
          notes: "Normal"
        });
      }
      updateCartUI();
    }

    function openHoldCustomModal(productId) {
      modalTriggerSource = 'HOLD';
      activeProductId = productId;
      holdCustomQty = 1;
      resetChips();

      var prod = productsData.find(p => p.id === productId);
      document.getElementById('custom-modal-title').innerText = 'Custom: ' + prod.nama;
      
      document.getElementById('hold-qty-val').innerText = '1';
      document.getElementById('mode-hold-group').classList.remove('hidden');
      document.getElementById('mode-cart-group').classList.add('hidden');
      
      document.getElementById('custom-modal').classList.remove('hidden');
    }

    function openCartCustomModal(index) {
      modalTriggerSource = 'CART';
      activeCartIndex = index;
      resetChips();

      var item = currentCart[index];
      document.getElementById('custom-modal-title').innerText = 'Custom: ' + item.nama;
      
      var select = document.getElementById('custom-apply-qty');
      select.innerHTML = '';
      for (var i = 1; i <= item.qty; i++) {
        select.innerHTML += `<option value="${i}">${i} Pcs ${i === item.qty ? '(Semua)' : ''}</option>`;
      }
      select.value = item.qty;

      document.getElementById('mode-hold-group').classList.add('hidden');
      document.getElementById('mode-cart-group').classList.remove('hidden');
      
      document.getElementById('custom-modal').classList.remove('hidden');
    }

    function adjustHoldQty(delta) {
      holdCustomQty = Math.max(1, holdCustomQty + delta);
      document.getElementById('hold-qty-val').innerText = holdCustomQty;
    }

    function resetChips() {
      selectedIce = "Normal Ice";
      selectedSugar = "Normal Sugar";
      document.querySelectorAll('.chip').forEach(c => c.classList.remove('selected'));
      document.querySelectorAll('.chip-group').forEach(grp => grp.children[0].classList.add('selected'));
    }

    function selectChip(el, type, val) {
      var parent = el.parentElement;
      parent.querySelectorAll('.chip').forEach(c => c.classList.remove('selected'));
      el.classList.add('selected');
      if (type === 'ice') selectedIce = val;
      if (type === 'sugar') selectedSugar = val;
    }

    function saveCustomModifier() {
      var newNote = `${selectedIce}, ${selectedSugar}`;

      if (modalTriggerSource === 'HOLD') {
        var prod = productsData.find(p => p.id === activeProductId);
        currentCart.push({
          cartItemId: Date.now() + '_' + Math.random().toString(36).substr(2, 4),
          id: prod.id,
          nama: prod.nama,
          harga: prod.harga,
          qty: holdCustomQty,
          notes: newNote
        });
      } else if (modalTriggerSource === 'CART') {
        var targetItem = currentCart[activeCartIndex];
        var applyQty = Number(document.getElementById('custom-apply-qty').value);

        if (applyQty === targetItem.qty) {
          targetItem.notes = newNote;
        } else {
          targetItem.qty -= applyQty;
          currentCart.push({
            cartItemId: Date.now() + '_split',
            id: targetItem.id,
            nama: targetItem.nama,
            harga: targetItem.harga,
            qty: applyQty,
            notes: newNote
          });
        }
      }

      closeModal('custom-modal');
      updateCartUI();
    }

    function updateCartUI() {
      var container = document.getElementById('cart-items');
      if (currentCart.length === 0) {
        container.innerHTML = '<p style="color: var(--text-muted); text-align: center; margin-top: 40px; font-size:13px; font-weight: 600;">Keranjang masih kosong</p>';
        document.getElementById('cart-total-val').innerText = 'Rp 0';
        return;
      }

      var total = 0;
      container.innerHTML = currentCart.map((item, idx) => {
        var subtotal = item.harga * item.qty;
        total += subtotal;
        return `
          <div class="cart-item">
            <div class="cart-item-header">
              <span class="cart-item-title">${item.nama}</span>
              <span class="cart-item-price">Rp ${subtotal.toLocaleString('id-ID')}</span>
            </div>
            
            ${item.notes !== "Normal" ? `
              <div class="cart-item-notes">
                <!-- SVG Edit/Pencil Icon -->
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
                ${item.notes}
              </div>
            ` : ''}

            <div class="cart-item-footer">
              <button onclick="openCartCustomModal(${idx})" class="btn-custom">
                <!-- SVG Settings Icon -->
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
                Custom
              </button>
              
              <div class="qty-control">
                <button class="btn-qty" onclick="updateQty(${idx}, -1)">-</button>
                <span class="qty-num">${item.qty}</span>
                <button class="btn-qty" onclick="updateQty(${idx}, 1)">+</button>
              </div>
            </div>
          </div>
        `;
      }).join('');

      document.getElementById('cart-total-val').innerText = `Rp ${total.toLocaleString('id-ID')}`;
    }

    function updateQty(index, delta) {
      currentCart[index].qty += delta;
      if (currentCart[index].qty <= 0) currentCart.splice(index, 1);
      updateCartUI();
    }

    function clearCart() { currentCart = []; updateCartUI(); }

    function openPaymentModal() {
      if (currentCart.length === 0) return alert('Keranjang kosong!');
      var custName = document.getElementById('cust-name').value;
      if (!custName) return alert('Silakan isi nama/no pelanggan terlebih dahulu!');

      var subtotal = currentCart.reduce((a, b) => a + (b.harga * b.qty), 0);
      document.getElementById('pay-total-akhir').value = 'Rp ' + subtotal.toLocaleString('id-ID');
      document.getElementById('pay-cash-paid').value = '';
      document.getElementById('pay-change').value = 'Rp 0';
      document.getElementById('payment-modal').classList.remove('hidden');
    }

    function togglePayMethod() {
      var method = document.getElementById('pay-method').value;
      if (method === 'QRIS') document.getElementById('cash-group').classList.add('hidden');
      else document.getElementById('cash-group').classList.remove('hidden');
    }

    function calculatePayment() {
      var subtotal = currentCart.reduce((a, b) => a + (b.harga * b.qty), 0);
      var method = document.getElementById('pay-method').value;
      if (method === 'CASH') {
        var cashPaid = Number(document.getElementById('pay-cash-paid').value) || 0;
        var change = cashPaid - subtotal;
        document.getElementById('pay-change').value = change >= 0 ? 'Rp ' + change.toLocaleString('id-ID') : 'Uang Kurang!';
      }
    }

    function submitTransaction() {
      var subtotal = currentCart.reduce((a, b) => a + (b.harga * b.qty), 0);
      var method = document.getElementById('pay-method').value;
      var cashPaid = method === 'CASH' ? Number(document.getElementById('pay-cash-paid').value) || 0 : subtotal;
      var custName = document.getElementById('cust-name').value;

      if (method === 'CASH' && cashPaid < subtotal) return alert('Uang pembayaran masih kurang!');

      var payload = {
        kasirId: currentUser.id, customerName: custName, subtotal: subtotal, totalAkhir: subtotal,
        metode: method, cashPaid: cashPaid, items: currentCart
      };

      fetch(API_URL, {
        method: 'POST',
        body: JSON.stringify({ action: 'saveTransaction', payload: payload })
      })
      .then(res => res.json())
      .then(res => {
        if (res.success) {
          alert('Transaksi a/n ' + custName + ' Berhasil!');
          closeModal('payment-modal');
          document.getElementById('cust-name').value = '';
          clearCart();
        } else { alert('Gagal simpan: ' + res.message); }
      });
    }

    function closeModal(id) { document.getElementById(id).classList.add('hidden'); }
    function logout() { localStorage.removeItem('qiski_session'); location.reload(); }
  </script>
</body>
</html>
